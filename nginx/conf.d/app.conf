# Upstream port must match PORT in .env (default 3000) — Nginx config files
# aren't env-substituted, so this is a plain literal, not ${PORT}.
upstream nest_app {
  least_conn;
  server app:3000 max_fails=3 fail_timeout=10s;
  keepalive 32;
}

# Plain-HTTP: only serves ACME/Let's Encrypt challenges and the health probe,
# everything else redirects to HTTPS.
server {
  listen 80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location = /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 15m;

  limit_conn conn_per_ip 20;

  location = /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # Tighter budget on auth endpoints (login/register/refresh/forgot-password)
  # to blunt credential-stuffing/brute-force before it reaches the app.
  location ~ ^/api/v[0-9]+/auth/ {
    limit_req zone=api_auth burst=10 nodelay;
    proxy_pass http://nest_app;
    include /etc/nginx/conf.d/proxy_params.inc;
  }

  location / {
    limit_req zone=api_general burst=40 nodelay;
    proxy_pass http://nest_app;
    include /etc/nginx/conf.d/proxy_params.inc;
  }
}
