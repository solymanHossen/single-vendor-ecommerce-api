user  nginx;
worker_processes  auto;
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  4096;
  multi_accept        on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main
    '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
    'uht="$upstream_header_time" urt="$upstream_response_time"';

  access_log  /var/log/nginx/access.log  main;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  server_tokens off;
  client_max_body_size 15m;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    application/json
    application/javascript
    application/xml
    text/plain
    text/css
    text/xml;

  # Rate limiting: general API traffic vs. tighter auth-endpoint budget.
  # These are an edge-level backstop — the app's own Redis-backed throttler
  # (see ALLOWED_ORIGINS/TRUST_PROXY in .env.example) is still the source of
  # truth for per-route limits; this just protects Nginx/upstreams from
  # being overwhelmed before a request ever reaches the app.
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=app_cache:10m max_size=100m inactive=60m use_temp_path=off;

  include /etc/nginx/conf.d/*.conf;
}
